apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: rss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      containers:
        - name: miniflux
          image: miniflux/miniflux:latest
          envFrom:
            - secretRef:
                name: rss-secrets # Pulls DATABASE_URL, ADMIN_USERNAME, ADMIN_PASSWORD
          env:
            - name: RUN_MIGRATIONS
              value: "1"
            - name: CREATE_ADMIN
              value: "1"
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: rss
spec:
  selector:
    app: miniflux
  ports:
    - port: 8080
      targetPort: 8080
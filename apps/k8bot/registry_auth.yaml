apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-pull-secret-eso
  namespace: k8bot
spec:
  refreshInterval: "12h"
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: gitea-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # FIXED: Removed the \ escaping inside the printf function
        .dockerconfigjson: '{"auths":{"git.mcagr.com":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: "gitea_registry_token/username" 
    - secretKey: password
      remoteRef:
        key: "gitea_registry_token/password"
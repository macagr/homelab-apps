existingCommunicationsSecretName: "botkube-communications"

communications:
  default-group:
    socketSlack:
      enabled: true
      channels:
        default:
          name: "kubebot"
          bindings:
            executors:
              - kubectl-read-only
              - argocd
            sources:
              - kubernetes-errors
              - argocd-events
      botToken: "REPLACED_BY_SECRET"
      appToken: "REPLACED_BY_SECRET"

sources:
  kubernetes-errors:
    botkube/kubernetes:
      context:
        rbac:
          group:
            type: Static
            static:
              values: ["botkube-plugins-default"]
      config:
        event:
          types:
            - create
            - delete
            - error
        resources:
          - type: v1/pods
          - type: v1/services
          - type: apps/v1/deployments
          - type: apps/v1/statefulsets
          - type: apps/v1/daemonsets
          - type: batch/v1/jobs
  argocd-events:
    botkube/kubernetes:
      context:
        rbac:
          group:
            type: Static
            static:
              values: ["botkube-plugins-default"]
      config:
        event:
          types:
            - create
            - update
            - delete
            - error
        namespaces:
          include: ["argocd"]
        resources:
          - type: argoproj.io/v1alpha1/applications
          - type: argoproj.io/v1alpha1/appprojects

executors:
  kubectl-read-only:
    botkube/kubectl:
      config:
        defaultNamespace: default
        interactiveBuilder:
          allowed:
            verbs: ["get", "describe", "logs", "top"]
            resources: ["pods", "deployments", "services", "nodes", "namespaces", "statefulsets", "daemonsets", "jobs", "configmaps", "events"]
  argocd:
    botkube/exec:
      config:
        commands:
          - name: "argocd"
            command: "argocd"
            allowed:
              subcommands:
                - "app"
                - "proj"
              verbs:
                - "list"
                - "get"
                - "sync"
                - "diff"
                - "rollback"
                - "history"
                - "terminate-op"

# Protect the Raspberry Pis!
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
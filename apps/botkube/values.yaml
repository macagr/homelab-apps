existingCommunicationsSecretName: "botkube-communications"

communications:
  default-group:
    socketSlack:
      enabled: true
      channels:
        default:
          name: "kubebot"
          notification:
            disabled: false
          bindings:
            executors:
              - kubectl-read-only
              - argocd
            sources:
              - kubernetes-errors
              - argocd-events
      botToken: "placeholder"
      appToken: "placeholder"

sources:
  kubernetes-errors:
    botkube/kubernetes:
      enabled: true
      context:
        rbac:
          group:
            type: Static
            static:
              values: ["botkube-plugins-default"]
      config:
        event:
          types:
            - create
            - delete
            - error
        resources:
          - type: v1/pods
          - type: v1/services
          - type: apps/v1/deployments
          - type: apps/v1/statefulsets
          - type: apps/v1/daemonsets
          - type: batch/v1/jobs
  argocd-events:
    botkube/kubernetes:
      enabled: true
      context:
        rbac:
          group:
            type: Static
            static:
              values: ["botkube-plugins-default"]
      config:
        event:
          types:
            - create
            - update
            - delete
            - error
        namespaces:
          include: ["argocd"]
        resources:
          - type: argoproj.io/v1alpha1/applications
          - type: argoproj.io/v1alpha1/appprojects

executors:
  kubectl-read-only:
    botkube/kubectl:
      enabled: true
      config:
        defaultNamespace: default
        interactiveBuilder:
          allowed:
            verbs: ["get", "describe", "logs", "top"]
            resources: ["pods", "deployments", "services", "nodes", "namespaces", "statefulsets", "daemonsets", "jobs", "configmaps", "events"]
  argocd:
    botkube/exec:
      enabled: true
      config:
        commands:
          - name: "argocd"
            command: "argocd"
            allowed:
              subcommands:
                - "app"
                - "proj"
              verbs:
                - "list"
                - "get"
                - "sync"
                - "diff"
                - "rollback"
                - "history"
                - "terminate-op"

# Override config load order so comm_config.yaml (ESO secret) loads LAST.
# The chart's persistent-config template uses `lookup` to render the runtime ConfigMap,
# but ArgoCD's `helm template` doesn't support `lookup`, resulting in an empty
# `communications:` key in _runtime_state.yaml that overwrites the real Slack config.
# Putting comm_config.yaml last ensures it always wins.
extraEnv:
  - name: BOTKUBE_CONFIG_PATHS
    value: "/config/global_config.yaml,/config/_runtime_state.yaml,/startup-config/_startup_state.yaml,/config/comm_config.yaml"
  - name: LOG_LEVEL_SOURCE_BOTKUBE_KUBERNETES
    value: debug

settings:
  clusterName: homelab
  log:
    level: debug
    formatter: json

# Protect the Raspberry Pis!
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
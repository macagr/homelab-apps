---
# Route all traffic hitting the test-app Gateway to the nginx service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-app
  namespace: test-app
  labels:
    app.kubernetes.io/name: test-app
    app.kubernetes.io/part-of: test-app
spec:
  parentRefs:
    - name: test-app-gateway
      namespace: test-app
      sectionName: http
  rules:
    - backendRefs:
        - name: test-app
          port: 80

apiVersion: v2
name: descheduler-stack
version: 1.0.0
description: |
  Umbrella chart wrapping the upstream kubernetes-sigs/descheduler chart.
  Pins the chart version and applies homelab-specific overrides (placement,
  cadence, narrowed plugin set, conservative eviction safety) via values.yaml.
  See ../../docs/descheduler.md for the architectural decisions encoded here.
dependencies:
  - name: descheduler
    # 0.35.1 is required (not 0.35.0) — earlier chart versions are missing
    # the persistentvolumeclaims get/watch/list rule in the ClusterRole,
    # which descheduler needs unconditionally for the nodeFit eviction
    # check (verifying volume topology when deciding if a pod can be moved).
    # Pinning below 0.35.1 produces "persistentvolumeclaims is forbidden"
    # errors on every reconcile.
    version: 0.35.1
    repository: https://kubernetes-sigs.github.io/descheduler/

# Descheduler Helm chart overrides.
# Decisions documented in docs/descheduler.md.
# All keys nested under `descheduler:` because this is an umbrella chart and
# the upstream values live under that dependency name.

descheduler:
  # Cadence
  # Once daily at 04:00 UTC. Trade-off: after a node flap the cluster may
  # run with collapsed replicas for up to 24 h before descheduler rebalances.
  # For a homelab that's acceptable — pi-03 outages are infrequent and the
  # surviving replica continues serving. If this turns out to be too slow in
  # practice (e.g. pi-03 flaps multiple times a week), a sensible middle
  # ground is "0 */6 * * *" (every 6 hours).
  kind: CronJob
  schedule: "0 4 * * *"
  replicas: 1

  # Job lifecycle: keep one successful + one failed Job for debug, and
  # auto-delete each Job 1 hour after it finishes so failed pods don't
  # accumulate (we hit this with the v0.35.0 RBAC issue — 7 Error pods
  # from a single retrying Job that stuck around).
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  ttlSecondsAfterFinished: 3600

  # Placement 
  # Pi-03 (workload=apps), with node-4 as fallback. Same eligible set used
  # by every other API-heavy controller in the cluster.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - { key: workload, operator: In, values: [apps] }
          - matchExpressions:
              - { key: node-location, operator: In, values: [cloud] }
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - { key: workload, operator: In, values: [apps] }

  # Resource budget 
  # Tightened from chart defaults (500m/256Mi). Descheduler is bursty —
  # most of its 15 min cycle is idle.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Policy 
  # Replaces the chart default policy entirely. Enables only what's relevant
  # to the placement-drift problem; explicitly omits LowNodeUtilization,
  # HighNodeUtilization, RemovePodsHavingTooManyRestarts, and
  # RemovePodsViolatingNodeTaints. See docs/descheduler.md §1–2.
  deschedulerPolicyAPIVersion: descheduler/v1alpha2
  deschedulerPolicy:
    profiles:
      - name: default
        pluginConfig:
          # Eviction safety guards — see docs/descheduler.md §3.
          # nodeFit: true is the load-bearing protection here — descheduler
          # only evicts a pod if it can verify another node can take it.
          # For local-path-backed PVCs (registry-mirror, gitea, monitoring,
          # valkey-cluster, rss-db) the volume is anchored to one node, so
          # no other node "fits" → eviction is automatically skipped.
          # We deliberately do NOT set ignorePvcPods: true — that would
          # require granting list/watch on PVCs cluster-wide, which the
          # chart's default RBAC does not provide.
          - name: DefaultEvictor
            args:
              evictLocalStoragePods: false
              evictDaemonSetPods: false
              evictSystemCriticalPods: false
              nodeFit: true
          - name: RemovePodsViolatingNodeAffinity
            args:
              nodeAffinityType:
                - requiredDuringSchedulingIgnoredDuringExecution
          - name: RemoveDuplicates
          - name: RemovePodsViolatingInterPodAntiAffinity
          - name: RemovePodsViolatingTopologySpreadConstraint
        plugins:
          balance:
            enabled:
              - RemoveDuplicates
              - RemovePodsViolatingTopologySpreadConstraint
          deschedule:
            enabled:
              - RemovePodsViolatingInterPodAntiAffinity
              - RemovePodsViolatingNodeAffinity

  # Logging 
  # v=3 (chart default) is verbose for the every-15-min cycle. Bump down.
  cmdOptions:
    v: 2

  # Misc 
  priorityClassName: system-cluster-critical
  serviceAccount:
    create: true
  rbac:
    create: true

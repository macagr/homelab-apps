---
# Route all traffic hitting the homepage Gateway to the nginx service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homepage
spec:
  parentRefs:
    - name: homepage-gateway
      namespace: homepage
      sectionName: https
  hostnames:
    - homelab.mcagr.com
  rules:
    - backendRefs:
        - name: homepage
          port: 80

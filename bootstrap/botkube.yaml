apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: botkube
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: botkube
  # Multiple Sources pattern
  sources:
    - repoURL: 'https://charts.botkube.io'
      chart: botkube
      targetRevision: 1.9.0
      helm:
        valueFiles:
          - $values/apps/botkube/values.yaml 
          
    - repoURL: 'https://github.com/macagr/homelab-app.git' # UPDATE THIS!
      targetRevision: main
      ref: values
      path: apps/botkube
      directory:
        # This is the magic line. It stops ArgoCD from trying to apply values.yaml as a raw manifest.
        exclude: 'values.yaml'
        
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Child Application: homepage
#
# Homelab welcome page. A lightweight nginx container serving a static
# landing page at homelab.mcagr.com.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/macagr/homelab-apps.git
    targetRevision: main
    path: apps/homepage

  destination:
    server: https://kubernetes.default.svc
    namespace: homepage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

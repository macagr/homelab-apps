# Child Application: monitoring
#
# VictoriaMetrics + Grafana observability stack. Component charts (no VM
# Operator / CRDs) to keep the ArgoCD sync surface small. Logs
# (VictoriaLogs) are intentionally deferred to a later revision.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.mcagr.com/macagr/homelab-apps.git
    targetRevision: main
    path: apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Server-side apply keeps large CRDs happy; no harm on plain
      # resources. Matches the pattern expected by Grafana's sizeable
      # datasources / dashboards ConfigMaps.
      - ServerSideApply=true

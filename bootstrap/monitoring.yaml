# Child Application: monitoring
#
# VictoriaMetrics + Grafana observability stack. Component charts (no VM
# Operator / CRDs) to keep the ArgoCD sync surface small. Logs
# (VictoriaLogs) are intentionally deferred to a later revision.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.mcagr.com/macagr/homelab-apps.git
    targetRevision: main
    path: apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Server-side apply keeps large CRDs happy; no harm on plain
      # resources. Matches the pattern expected by Grafana's sizeable
      # datasources / dashboards ConfigMaps.
      - ServerSideApply=true
  # ESO's mutating webhook fills in defaults for these fields on
  # ExternalSecret (Default / None / None / Ignore). They aren't in git
  # — and never will be — so ArgoCD would otherwise report permanent
  # drift. Ignoring the specific fields (not the whole spec.data block)
  # keeps real drift visible if someone hand-edits a remoteRef key.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
        - '.spec.data[].remoteRef.nullBytePolicy'
